# Build and cache the packages natively on GitHub's arm64 runners.
#
# - every push and pull request: evaluate the flake (every example system and
#   the VMs), check formatting, build every package for aarch64-linux, and
#   build the example Raspberry Pi 4 system end to end
# - with CACHIX_AUTH_TOKEN set: push the packages to Cachix, so downstream
#   systems download them instead of compiling them
#
# SD card images are not built here: users build theirs from their own
# configuration (see README).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    accept-flake-config = true
    experimental-features = nix-command flakes
  # The packages this repository compiles are kept in GitHub's Actions cache
  # as a local Nix binary cache (see README, "CI cache"), keyed on
  # flake.lock and pkgs/.
  # Optional: also push everything to Cachix when a token is configured, so
  # that machines outside CI (the Pi itself) can download the packages.
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'sweenu' }}

jobs:
  check:
    name: Evaluate and lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: nix flake check
        run: nix flake check --no-build --print-build-logs
      - name: Formatting
        run: nix build --print-build-logs .#checks.aarch64-linux.formatting

  packages:
    name: Packages (aarch64)
    runs-on: ubuntu-24.04-arm
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # The restored package cache is a local, unsigned binary cache;
          # trusted=1 lets Nix substitute from it without signatures.
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org file://${{ runner.temp }}/nix-cache?trusted=1&priority=10
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Restore package cache
        id: nix-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-packages-${{ hashFiles('flake.lock', 'pkgs/**') }}
          restore-keys: nix-packages-
      - name: Prepare package cache
        run: |
          cache="$RUNNER_TEMP/nix-cache"
          mkdir -p "$cache"
          [ -f "$cache/nix-cache-info" ] || printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 10\n' > "$cache/nix-cache-info"
          du -sh "$cache"
      # After the package cache is in place: Cachix runs Nix, and the first
      # Nix command creates a missing file:// cache directory as root, which
      # the restore and the snapshot can then not write to.
      - name: Use and fill Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - name: Build every package
        run: |
          set -euo pipefail
          nix eval --json .#packages.aarch64-linux --apply 'builtins.attrNames' \
            | jq -r '.[] | ".#packages.aarch64-linux.\(.)"' > "$RUNNER_TEMP/targets"
          cat "$RUNNER_TEMP/targets"
          nix build --print-build-logs --keep-going --no-link $(cat "$RUNNER_TEMP/targets")
      - name: Snapshot package cache
        if: steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # A fresh snapshot of the packages and their runtime closure, so the
          # cache never accumulates outputs of older package versions.
          new="$RUNNER_TEMP/nix-cache.new"
          rm -rf "$new"
          nix copy --to "file://$new?compression=zstd&parallel-compression=true" $(cat "$RUNNER_TEMP/targets")
          # The Nix daemon (root) may have added directories to the old one.
          sudo rm -rf "$RUNNER_TEMP/nix-cache"
          mv "$new" "$RUNNER_TEMP/nix-cache"
          du -sh "$RUNNER_TEMP/nix-cache"
      - name: Save package cache
        if: steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-packages-${{ hashFiles('flake.lock', 'pkgs/**') }}

  system:
    name: Example system (Pi 4)
    runs-on: ubuntu-24.04-arm
    # After the packages job, so it reuses the packages that job cached.
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org file://${{ runner.temp }}/nix-cache?trusted=1&priority=10
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Restore package cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-packages-${{ hashFiles('flake.lock', 'pkgs/**') }}
          restore-keys: nix-packages-
      - name: Prepare package cache
        run: |
          cache="$RUNNER_TEMP/nix-cache"
          mkdir -p "$cache"
          [ -f "$cache/nix-cache-info" ] || printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 10\n' > "$cache/nix-cache-info"
      # Read from Cachix only: the packages job pushes what downstream systems
      # need; this system's kernel and configuration files are not worth
      # storing.
      - name: Use Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          skipPush: true
      - name: Build the example system
        run: nix build --print-build-logs --no-link .#checks.aarch64-linux.example-rpi4
