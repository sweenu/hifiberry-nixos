# Build the packages and SD card images natively on GitHub's arm64 runners.
#
# - every push and pull request: evaluate the flake, check formatting, build
#   all packages for aarch64-linux
# - pushes to main and manual runs: also build the SD images and keep them as
#   workflow artifacts
# - tags (v*): attach the images to a GitHub release
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      boards:
        description: "Boards to build images for (space separated: rpi02 rpi3 rpi4 rpi5)"
        default: "rpi5 rpi4"
        required: false

permissions:
  contents: write

env:
  NIX_CONFIG: |
    accept-flake-config = true
    experimental-features = nix-command flakes

jobs:
  check:
    name: Evaluate and lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: nix flake check
        run: nix flake check --no-build --print-build-logs
      - name: Formatting
        run: nix build --print-build-logs .#checks.aarch64-linux.formatting

  packages:
    name: Packages (aarch64)
    runs-on: ubuntu-24.04-arm
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Build every package
        run: |
          set -euo pipefail
          targets=$(nix eval --json .#packages.aarch64-linux --apply 'p: builtins.filter (n: !(builtins.match "image-.*" n != null)) (builtins.attrNames p)' | jq -r '.[] | ".#packages.aarch64-linux.\(.)"')
          echo "$targets"
          # shellcheck disable=SC2086
          nix build --print-build-logs --keep-going --no-link $targets

  plan:
    name: Select boards
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      boards: ${{ steps.boards.outputs.boards }}
    steps:
      - id: boards
        run: |
          boards="${{ github.event.inputs.boards || 'rpi5 rpi4' }}"
          echo "boards=$(printf '%s\n' $boards | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    name: SD image ${{ matrix.board }}
    runs-on: ubuntu-24.04-arm
    needs: [check, plan]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Build image
        run: |
          nix build --print-build-logs --out-link "result-${{ matrix.board }}" ".#images.${{ matrix.board }}"
          ls -la "result-${{ matrix.board }}/sd-image/"
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: hifiberry-nixos-${{ matrix.board }}
          path: result-*/sd-image/*.img.zst
          compression-level: 0
          retention-days: 14
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: result-*/sd-image/*.img.zst
